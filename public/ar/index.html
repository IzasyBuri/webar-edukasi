<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#fffaf0" />
  <title>WebAR Edukasi</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    :root {
      --cream:#fffaf0;--cream-soft:#faf5e8;--cream-card:#f5f0e0;--ink:#0a0a0a;--body:#3a3a3a;--muted:#6a6a6a;
      --teal:#1a3a3a;--pink:#ff4d8b;--lavender:#b8a4ed;--peach:#ffb084;--ochre:#e8b94a;--mint:#a4d4c5;
      --coral:#ff6b5a;--success:#22c55e;--error:#ef4444;--radius-button:12px;--radius-card:18px;
      --radius-large:24px;--radius-pill:9999px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#071510;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a-scene{position:fixed!important;inset:0!important;z-index:1!important;width:100vw!important;height:100dvh!important;background:transparent!important}
    .a-canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;background:transparent!important;touch-action:none}
    video{z-index:0!important;max-width:none!important}
    button,a{font:inherit}
    .ui{position:fixed;inset:0;z-index:10;pointer-events:none}
    .topbar{position:absolute;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 14px 18px;display:flex;align-items:center;justify-content:space-between}
    .back,.target-link{pointer-events:auto;min-width:44px;min-height:44px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(10,10,10,.12);border-radius:var(--radius-button);color:var(--ink);background:rgba(255,250,240,.94);box-shadow:0 3px 12px rgba(10,10,10,.12);text-decoration:none;font-size:13px;font-weight:600}
    .status{position:absolute;left:50%;top:max(78px,calc(env(safe-area-inset-top) + 62px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);min-height:36px;padding:8px 13px;display:flex;align-items:center;gap:8px;border:1px solid rgba(10,10,10,.1);border-radius:var(--radius-pill);color:var(--ink);background:rgba(255,250,240,.96);box-shadow:0 3px 12px rgba(10,10,10,.1);font-size:12px;font-weight:600}
    .status i{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--ochre)}
    .status.found{color:var(--teal);background:rgba(164,212,197,.97);border-color:rgba(26,58,58,.14)}
    .status.found i{background:var(--success)}
    .status.error{color:var(--ink);background:rgba(255,250,240,.97);border-color:rgba(239,68,68,.3)}
    .status.error i{background:var(--error)}
    .guide{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(76vw,350px);aspect-ratio:1.58;border:1px solid rgba(232,185,74,.48);border-radius:var(--radius-button);transition:opacity .25s ease}
    .guide:before{content:"";position:absolute;inset:-1px;border:3px solid transparent;border-left-color:var(--ochre);border-right-color:var(--ochre);border-radius:var(--radius-button)}
    .guide:after{content:"";position:absolute;left:9%;right:9%;top:14%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--mint),var(--ochre),transparent);box-shadow:0 0 10px rgba(232,185,74,.55);animation:scanner 2.6s ease-in-out infinite}
    .guide.hidden{opacity:0}
    .bottom{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 14px));transform:translateX(-50%);width:min(540px,calc(100% - 28px));padding:16px;border:1px solid rgba(10,10,10,.1);border-radius:var(--radius-large);color:var(--ink);background:rgba(255,250,240,.96);box-shadow:0 8px 24px rgba(10,10,10,.16)}
    .bottom strong{display:block;margin-bottom:5px;font-size:16px;font-weight:600;letter-spacing:-.2px}
    .bottom p{margin:0;color:var(--body);font-size:13px;line-height:1.45}
    .bottom.detected{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
    .learn{pointer-events:auto;min-width:96px;min-height:48px;padding:0 17px;border:0;border-radius:var(--radius-button);color:white;background:var(--ink);font-weight:600}
    .loading,.fatal{position:fixed;inset:0;z-index:30;padding:28px;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:var(--cream);text-align:center}
    .loading:before,.loading:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .loading:before{width:180px;height:180px;top:-70px;right:-55px;background:var(--peach)}
    .loading:after{width:125px;height:125px;left:-45px;bottom:-35px;background:var(--lavender)}
    .loading>div,.fatal>div{position:relative;z-index:1}
    .loading.hidden,.fatal{display:none}
    .fatal.visible{display:grid}
    .loading-ring{width:44px;height:44px;margin:0 auto 18px;border:4px solid rgba(26,58,58,.14);border-top-color:var(--teal);border-right-color:var(--pink);border-radius:50%;animation:spin .9s linear infinite}
    .loading strong{font-size:20px;font-weight:600;letter-spacing:-.3px}
    .loading p,.fatal p{max-width:360px;margin:8px auto 0;color:var(--body);font-size:14px;line-height:1.55}
    .fatal>div{width:min(420px,100%);padding:24px 20px;border-radius:var(--radius-large);background:#ffd1c9}
    .fatal h1{margin:0;font-size:clamp(28px,8vw,36px);font-weight:600;line-height:1.08;letter-spacing:-1px}
    .fatal a{display:inline-flex;min-width:44px;min-height:48px;margin-top:19px;padding:0 18px;align-items:center;justify-content:center;border-radius:var(--radius-button);color:white;background:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
    .sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;padding-top:40px;background:rgba(10,10,10,.48);pointer-events:auto}
    .sheet.open{display:flex}
    .sheet-card{position:relative;width:min(620px,100%);max-height:90dvh;margin:0 auto;overflow:auto;padding:24px 20px max(20px,env(safe-area-inset-bottom));border-radius:var(--radius-large) var(--radius-large) 0 0;color:var(--ink);background:var(--cream)}
    .sheet-card:before{content:"";position:absolute;right:-28px;top:22px;width:90px;height:90px;border-radius:50%;background:var(--mint);opacity:.55;pointer-events:none}
    .sheet-card>*{position:relative}
    .sheet-category{display:inline-flex;min-height:30px;margin:0 0 10px;padding:0 12px;align-items:center;border-radius:var(--radius-pill);color:var(--ink);background:var(--mint);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
    .sheet-category.bangunan{background:var(--ochre)}
    .sheet-category.tumbuhan{background:var(--mint)}
    .sheet h2{margin:0;font-size:clamp(28px,8vw,36px);font-weight:600;line-height:1.08;letter-spacing:-1px}
    .sheet-description{margin:13px 0 20px;color:var(--body);font-size:15px;line-height:1.55}
    .facts{display:grid;gap:9px}
    .fact{padding:14px 16px;border:0;border-radius:16px;color:var(--ink);font-size:14px;line-height:1.45}
    .fact:nth-child(1){background:var(--lavender)}
    .fact:nth-child(2){background:var(--peach)}
    .fact:nth-child(3){background:var(--ochre)}
    .close-sheet{width:100%;min-height:50px;margin-top:17px;border:0;border-radius:var(--radius-button);color:white;background:var(--ink);font-weight:600}
    @keyframes scanner{0%,100%{top:14%}50%{top:86%}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-height:620px){.status{top:68px}.guide{top:42%;width:min(58vw,270px)}.bottom{padding:13px 15px}.sheet-card{max-height:94dvh;padding-top:18px}.sheet-description{margin-bottom:14px}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="ui">
    <div class="topbar"><a class="back" href="/">← Kembali</a><a class="target-link" id="target-link" href="/" target="_blank" rel="noreferrer">Gambar target</a></div>
    <div class="status" id="status"><i></i><span>Memuat materi…</span></div>
    <div class="guide" id="guide"></div>
    <div class="bottom" id="bottom"><div><strong>Arahkan kamera ke gambar</strong><p>Pastikan seluruh gambar terlihat dan ruangan cukup terang.</p></div></div>
  </div>

  <div class="loading" id="loading"><div><div class="loading-ring"></div><strong>Menyiapkan kamera…</strong><p>Izinkan akses kamera saat diminta.</p></div></div>
  <div class="fatal" id="fatal"><div><h1 id="fatal-title">Kamera belum bisa dibuka</h1><p id="fatal-text">Izinkan penggunaan kamera, lalu coba kembali.</p><a href="/">Kembali ke beranda</a></div></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <p class="sheet-category" id="sheet-category"></p>
      <h2 id="sheet-title"></h2>
      <p class="sheet-description" id="sheet-description"></p>
      <div class="facts" id="facts"></div>
      <button class="close-sheet" id="close-sheet" type="button">Tutup</button>
    </div>
  </div>

  <script>
    (function () {
      const status = document.getElementById("status");
      const statusText = status.querySelector("span");
      const guide = document.getElementById("guide");
      const bottom = document.getElementById("bottom");
      const loading = document.getElementById("loading");
      const fatal = document.getElementById("fatal");
      const sheet = document.getElementById("sheet");
      let scene;
      let targetVisible = false;
      let removePointerControls = function () {};

      function setStatus(text, state) {
        statusText.textContent = text;
        status.className = "status" + (state ? " " + state : "");
      }

      function showFatal(title, text) {
        loading.classList.add("hidden");
        document.getElementById("fatal-title").textContent = title;
        document.getElementById("fatal-text").textContent = text;
        fatal.classList.add("visible");
      }

      function showAssetError() {
        setStatus("Objek tidak dapat dimuat", "error");
        bottom.className = "bottom";
        bottom.innerHTML = "<div><strong>Aset belum tersedia</strong><p>Kamera tetap aktif. Kembali dan pilih materi lain.</p></div>";
      }

      function fillInformation(item) {
        const category = document.getElementById("sheet-category");
        category.textContent = item.category;
        category.className = "sheet-category " + item.category.toLowerCase();
        document.getElementById("sheet-title").textContent = item.name;
        document.getElementById("sheet-description").textContent = item.description;
        const facts = document.getElementById("facts");
        facts.replaceChildren();
        item.facts.forEach(function (fact, index) {
          const card = document.createElement("div");
          card.className = "fact";
          card.textContent = (index + 1) + ". " + fact;
          facts.appendChild(card);
        });
      }

      function vectorToString(vector, fallback) {
        return (vector || fallback).join(" ");
      }

      function addPointerControls(canvas, pivot) {
        let activePointerId = null;
        let lastPointerX = 0;
        let rotationY = 0;

        function pointerDown(event) {
          if (!targetVisible || activePointerId !== null || !event.isPrimary) return;
          activePointerId = event.pointerId;
          lastPointerX = event.clientX;
          canvas.setPointerCapture(event.pointerId);
          event.preventDefault();
        }

        function pointerMove(event) {
          if (!targetVisible || event.pointerId !== activePointerId) return;
          const deltaX = event.clientX - lastPointerX;
          lastPointerX = event.clientX;
          rotationY += deltaX * 0.25;
          pivot.setAttribute("rotation", "0 " + rotationY + " 0");
          event.preventDefault();
        }

        function pointerEnd(event) {
          if (event.pointerId !== activePointerId) return;
          activePointerId = null;
          if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        }

        canvas.addEventListener("pointerdown", pointerDown, { passive: false });
        canvas.addEventListener("pointermove", pointerMove, { passive: false });
        canvas.addEventListener("pointerup", pointerEnd);
        canvas.addEventListener("pointercancel", pointerEnd);

        return function () {
          canvas.removeEventListener("pointerdown", pointerDown);
          canvas.removeEventListener("pointermove", pointerMove);
          canvas.removeEventListener("pointerup", pointerEnd);
          canvas.removeEventListener("pointercancel", pointerEnd);
        };
      }

      function renderScene(item) {
        document.title = item.name + " · WebAR Edukasi";
        document.getElementById("target-link").href = item.targetImageUrl;
        fillInformation(item);

        scene = document.createElement("a-scene");
        scene.setAttribute("mindar-image", "imageTargetSrc: " + item.targetMindUrl + "; autoStart: true; filterMinCF: 0.001; filterBeta: 10; warmupTolerance: 3; missTolerance: 5; uiLoading: no; uiScanning: no; uiError: no;");
        scene.setAttribute("color-space", "sRGB");
        scene.setAttribute("renderer", "colorManagement: true; physicallyCorrectLights: true; alpha: true");
        scene.setAttribute("vr-mode-ui", "enabled: false");
        scene.setAttribute("device-orientation-permission-ui", "enabled: false");

        const camera = document.createElement("a-camera");
        camera.setAttribute("position", "0 0 0");
        camera.setAttribute("look-controls", "enabled: false");
        scene.appendChild(camera);

        const ambientLight = document.createElement("a-light");
        ambientLight.setAttribute("type", "ambient");
        ambientLight.setAttribute("color", "#ffffff");
        ambientLight.setAttribute("intensity", "0.9");
        scene.appendChild(ambientLight);

        const directionalLight = document.createElement("a-light");
        directionalLight.setAttribute("type", "directional");
        directionalLight.setAttribute("color", "#ffffff");
        directionalLight.setAttribute("intensity", "1.2");
        directionalLight.setAttribute("position", "-1 2 2");
        scene.appendChild(directionalLight);

        const target = document.createElement("a-entity");
        target.setAttribute("mindar-image-target", "targetIndex: 0");
        const pivot = document.createElement("a-entity");
        pivot.setAttribute("position", vectorToString(item.position, [0, 0, 0.2]));
        pivot.setAttribute("rotation", "0 0 0");
        pivot.setAttribute("visible", "false");
        const object = document.createElement(item.displayType === "model" ? "a-gltf-model" : "a-image");
        object.setAttribute("src", item.assetUrl);
        object.setAttribute("position", "0 0 0");
        object.setAttribute("rotation", vectorToString(item.rotation, [0, 0, 0]));
        object.setAttribute("scale", item.scale + " " + item.scale + " " + item.scale);
        if (item.displayType === "model") {
          object.addEventListener("model-error", showAssetError);
        } else {
          object.setAttribute("width", "1");
          object.setAttribute("height", "0.6");
          object.setAttribute("material", "transparent: true; alphaTest: 0.05; side: double");
          const probe = new Image();
          probe.onerror = showAssetError;
          probe.src = item.assetUrl;
        }
        pivot.appendChild(object);

        if (item.hasPlatform) {
          const platform = document.createElement("a-cylinder");
          platform.setAttribute("radius", "0.5");
          platform.setAttribute("height", "0.08");
          platform.setAttribute("position", "0 -0.1 0");
          platform.setAttribute("color", "#75614a");
          platform.setAttribute("material", "roughness: 0.9; metalness: 0");
          pivot.appendChild(platform);
        }

        target.appendChild(pivot);
        scene.appendChild(target);

        target.addEventListener("targetFound", function () {
          targetVisible = true;
          pivot.setAttribute("visible", "true");
          setStatus(item.name + " ditemukan", "found");
          guide.classList.add("hidden");
          bottom.className = "bottom detected";
          bottom.innerHTML = "<div><strong></strong><p>Geser kiri atau kanan untuk memutar objek.</p></div><button class=\"learn\" type=\"button\">Pelajari</button>";
          bottom.querySelector("strong").textContent = item.name;
          bottom.querySelector("button").addEventListener("click", function () { sheet.classList.add("open"); });
        });
        target.addEventListener("targetLost", function () {
          targetVisible = false;
          pivot.setAttribute("visible", "false");
          setStatus("Gambar terlepas, arahkan kembali", "");
          guide.classList.remove("hidden");
          bottom.className = "bottom";
          bottom.innerHTML = "<div><strong>Arahkan kamera ke gambar</strong><p>Gambarnya terlepas. Pastikan seluruh gambar terlihat, lalu coba lagi.</p></div>";
        });
        scene.addEventListener("arReady", function () {
          loading.classList.add("hidden");
          setStatus("Mencari gambar target…", "");
        });
        scene.addEventListener("arError", function () {
          showFatal("Kamera belum bisa dibuka", "Izinkan penggunaan kamera, lalu coba kembali.");
        });
        scene.addEventListener("renderstart", function () {
          removePointerControls();
          removePointerControls = addPointerControls(scene.canvas, pivot);
        }, { once: true });
        document.body.insertBefore(scene, document.body.firstChild);
      }

      function stopCamera() {
        try {
          targetVisible = false;
          removePointerControls();
          if (scene && scene.systems && scene.systems["mindar-image-system"]) scene.systems["mindar-image-system"].stop();
          document.querySelectorAll("video").forEach(function (video) {
            if (video.srcObject) video.srcObject.getTracks().forEach(function (track) { track.stop(); });
          });
        } catch (_) {}
      }

      document.getElementById("close-sheet").addEventListener("click", function () { sheet.classList.remove("open"); });
      sheet.addEventListener("click", function (event) { if (event.target === sheet) sheet.classList.remove("open"); });
      window.addEventListener("pagehide", stopCamera);
      window.addEventListener("beforeunload", stopCamera);

      const pathSlug = location.pathname.match(/^\/ar\/([^/]+)\/?$/);
      const slug = new URLSearchParams(location.search).get("slug") || (pathSlug && decodeURIComponent(pathSlug[1]));
      if (!slug) {
        showFatal("Materi tidak ditemukan", "Buka materi melalui salah satu tombol Mulai AR di beranda.");
        return;
      }

      fetch("/api/ar-objects/" + encodeURIComponent(slug))
        .then(function (response) { if (!response.ok) throw new Error("not-found"); return response.json(); })
        .then(renderScene)
        .catch(function () { showFatal("Materi tidak ditemukan", "Materi ini belum tersedia. Kembali ke beranda dan pilih materi lain."); });
    })();
  </script>
</body>
</html>
