<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#071510" />
  <title>Pengalaman AR · WebAR Edukasi</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#071510;color:white;font-family:Arial,sans-serif}
    .ui{position:fixed;inset:0;z-index:10;pointer-events:none}.topbar{position:absolute;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 18px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#071510cc,transparent)}
    .back,.help{pointer-events:auto;min-height:42px;border:1px solid rgba(255,255,255,.22);background:rgba(7,21,16,.72);color:white;border-radius:99px;padding:0 16px;display:inline-flex;align-items:center;text-decoration:none;font-size:13px;backdrop-filter:blur(10px)}
    .status{position:absolute;left:50%;top:88px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 36px);display:flex;align-items:center;gap:9px;padding:10px 15px;border:1px solid rgba(113,242,173,.28);border-radius:99px;background:rgba(7,21,16,.78);color:#c8ded4;font-size:12px;backdrop-filter:blur(10px)}
    .status i{width:8px;height:8px;border-radius:50%;background:#f0b95b;box-shadow:0 0 12px currentColor}.status.found i{background:#71f2ad}.status.found span{color:#71f2ad}
    .guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78vw,360px);aspect-ratio:1.58;border:1px solid rgba(113,242,173,.55);border-radius:12px;transition:opacity .25s ease}.guide::before{content:"";position:absolute;inset:-1px;border:3px solid transparent;border-left-color:#71f2ad;border-right-color:#71f2ad;border-radius:12px}.guide::after{content:"";position:absolute;left:8%;right:8%;top:12%;height:1px;background:linear-gradient(90deg,transparent,#71f2ad,transparent);box-shadow:0 0 14px #71f2ad;animation:scanner 2.4s ease-in-out infinite}.guide.hidden{opacity:0}
    .bottom{position:absolute;left:18px;right:18px;bottom:max(20px,env(safe-area-inset-bottom));padding:17px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(7,21,16,.82);backdrop-filter:blur(12px);text-align:center}.bottom strong{display:block;margin-bottom:6px;font-size:15px}.bottom span{color:#a8beb4;font-size:12px;line-height:1.45}
    .error{display:none;position:fixed;inset:0;z-index:30;padding:30px;background:#071510;place-items:center;text-align:center}.error.visible{display:grid}.error h1{font:400 38px Georgia,serif;margin:0 0 12px}.error p{color:#a8beb4;line-height:1.6;max-width:420px}.error a{color:#071510;background:#71f2ad;padding:14px 20px;text-decoration:none;display:inline-block;margin-top:10px}
    @keyframes scanner{0%,100%{top:12%}50%{top:88%}}
  </style>
  <script>
    AFRAME.registerComponent("flower-reveal",{init:function(){const flower=this.el,status=document.querySelector(".status"),guide=document.querySelector(".guide");flower.object3D.scale.set(.001,.001,.001);this.el.parentEl.addEventListener("targetFound",()=>{status.classList.add("found");status.querySelector("span").textContent="Rafflesia ditemukan";guide.classList.add("hidden");flower.setAttribute("animation__reveal","property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 850; easing: easeOutBack")});this.el.parentEl.addEventListener("targetLost",()=>{status.classList.remove("found");status.querySelector("span").textContent="Mencari gambar target…";guide.classList.remove("hidden")})}});
    window.addEventListener("load",()=>{document.querySelector("a-scene").addEventListener("arError",()=>document.querySelector(".error").classList.add("visible"))});
  </script>
</head>
<body>
  <div class="ui">
    <div class="topbar"><a class="back" href="/">← Kembali</a><a class="help" href="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" target="_blank">Gambar target</a></div>
    <div class="status"><i></i><span>Mencari gambar target…</span></div><div class="guide"></div>
    <div class="bottom"><strong>Arahkan ke seluruh gambar</strong><span>Jaga ponsel tetap stabil dan gunakan pencahayaan yang cukup.</span></div>
  </div>
  <div class="error"><div><h1>Kamera belum dapat dibuka</h1><p>Pastikan izin kamera diberikan dan halaman dibuka melalui HTTPS di ponsel.</p><a href="/">Kembali ke beranda</a></div></div>
  <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01;" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity flower-reveal position="0 0 0.18" animation__float="property: position; from: 0 0 0.16; to: 0 0 0.23; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine">
        <a-sphere position="0 .28 0" scale=".32 .52 .10" color="#c74745"></a-sphere><a-sphere position=".27 .13 0" rotation="0 0 -55" scale=".30 .52 .10" color="#e26151"></a-sphere><a-sphere position=".34 -.18 0" rotation="0 0 -105" scale=".31 .51 .10" color="#9f2f3a"></a-sphere><a-sphere position=".09 -.36 0" rotation="0 0 -165" scale=".30 .52 .10" color="#d94d47"></a-sphere><a-sphere position="-.23 -.27 0" rotation="0 0 140" scale=".31 .52 .10" color="#a42b36"></a-sphere><a-sphere position="-.35 .03 0" rotation="0 0 85" scale=".31 .52 .10" color="#e56a55"></a-sphere><a-sphere position="-.18 .29 0" rotation="0 0 30" scale=".30 .50 .10" color="#b7353d"></a-sphere>
        <a-cylinder position="0 0 .08" radius=".22" height=".10" rotation="90 0 0" color="#3a1712"></a-cylinder><a-torus position="0 0 .15" radius=".14" radius-tubular=".035" color="#edb651"></a-torus><a-sphere position="0 0 .17" scale=".08 .08 .04" color="#20100c"></a-sphere>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
